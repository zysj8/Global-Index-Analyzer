<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全球组合监控</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #f8f9fa; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #007bff; color: white; }
        .high { color: #d9534f; font-weight: bold; }
        .low { color: #5cb85c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>全球指数估值与仓位建议</h1>
        <p id="utime" style="color:#888; font-size:13px;"></p>
        <table>
            <thead>
                <tr>
                    <th>指数名称</th><th>估值方法</th><th>估值百分位</th><th>目标权重</th><th>建议仓位</th>
                </tr>
            </thead>
            <tbody id="content"></tbody>
        </table>
    </div>
    <script>
        async function load() {
            const res = await fetch('valuation_report.json?t=' + Date.now());
            const data = await res.json();
            document.getElementById('utime').innerText = "最后更新: " + data.update_time;
            document.getElementById('content').innerHTML = data.results.map(item => `
                <tr>
                    <td>${item.index}</td>
                    <td>${item.method}</td>
                    <td>${item.percentile}</td>
                    <td>${item.target_weight}%</td>
                    <td class="${parseFloat(item.percentile) > 80 ? 'high' : 'low'}">${item.suggested_pos}%</td>
                </tr>
            `).join('');
        }
        load();
    </script>
</body>
</html>
