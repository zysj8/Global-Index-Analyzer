<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全球指数仓位监控</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #f8f9fa; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { font-size: 20px; color: #333; margin-top: 0; }
        .time { font-size: 13px; color: #888; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #007bff; color: white; font-weight: normal; }
        .high { color: #d9534f; font-weight: bold; }
        .low { color: #5cb85c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>全球指数估值与仓位建议</h1>
        <p class="time" id="update-time"></p>
        <table>
            <thead>
                <tr>
                    <th>指数名称</th>
                    <th>估值方法</th>
                    <th>估值百分位</th>
                    <th>目标权重</th>
                    <th>建议仓位(占目标)</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        async function load() {
            const res = await fetch('valuation_report.json?t=' + Date.now());
            const data = await res.json();
            document.getElementById('update-time').innerText = "最后更新时间: " + data.update_time;
            
            let html = '';
            data.results.forEach(item => {
                const isHigh = parseFloat(item.percentile) > 80;
                // 注意：此处代码负责添加百分号，后端不再添加
                html += `<tr>
                    <td>${item.index}</td>
                    <td>${item.method}</td>
                    <td>${item.percentile}</td>
                    <td>${item.target_weight}%</td>
                    <td class="${isHigh ? 'high' : 'low'}">${item.suggested_pos}%</td>
                </tr>`;
            });
            document.getElementById('table-body').innerHTML = html;
        }
        load();
    </script>
</body>
</html>
