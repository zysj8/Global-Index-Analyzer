<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全球组合监控</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; padding: 30px; background: #f8f9fa; }
        .card { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; font-size: 22px; border-left: 5px solid #007bff; padding-left: 15px; }
        .time { font-size: 14px; color: #95a5a6; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #edf2f7; text-align: left; }
        th { background: #007bff; color: white; font-weight: 500; }
        .high { color: #e74c3c; font-weight: bold; }
        .low { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>全球指数估值与仓位建议</h1>
        <p class="time" id="time-display"></p>
        <table>
            <thead>
                <tr>
                    <th>指数名称</th>
                    <th>估值方法</th>
                    <th>估值百分位</th>
                    <th>目标权重</th>
                    <th>建议仓位(占目标)</th>
                </tr>
            </thead>
            <tbody id="content-body"></tbody>
        </table>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const res = await fetch('valuation_report.json?t=' + Date.now());
                const data = await res.json();
                document.getElementById('time-display').innerText = "最后更新时间: " + data.update_time;
                
                let html = '';
                data.results.forEach(item => {
                    const isHigh = parseFloat(item.percentile) > 80;
                    // 在此层级拼接 % 符号，确保后端数据纯净
                    html += `<tr>
                        <td>${item.index}</td>
                        <td>${item.method}</td>
                        <td>${item.percentile}</td>
                        <td>${item.target_weight}%</td>
                        <td class="${isHigh ? 'high' : 'low'}">${item.suggested_pos}%</td>
                    </tr>`;
                });
                document.getElementById('content-body').innerHTML = html;
            } catch (e) {
                console.error("加载数据失败", e);
            }
        }
        updateDashboard();
    </script>
</body>
</html>
