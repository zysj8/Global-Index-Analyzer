<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全球指数仓位监控</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 25px; background: #f8f9fa; }
        .dashboard { max-width: 1100px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 5px; }
        .time { font-size: 13px; color: #7f8c8d; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #edf2f7; text-align: left; }
        th { background: #007bff; color: white; font-weight: 500; }
        .high { color: #e74c3c; font-weight: bold; } /* 高估红色 */
        .low { color: #27ae60; font-weight: bold; }  /* 低估绿色 */
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>全球指数估值与仓位建议</h1>
        <p class="time" id="last-update">数据加载中...</p>
        <table>
            <thead>
                <tr>
                    <th>指数名称</th>
                    <th>估值方法</th>
                    <th>估值百分位</th>
                    <th>目标权重</th>
                    <th>建议仓位(占目标)</th>
                </tr>
            </thead>
            <tbody id="table-content"></tbody>
        </table>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('valuation_report.json?t=' + Date.now());
                const data = await response.json();
                document.getElementById('last-update').innerText = "最后更新时间: " + data.update_time;
                
                const container = document.getElementById('table-content');
                container.innerHTML = data.results.map(item => {
                    const pVal = parseFloat(item.percentile);
                    const statusClass = pVal > 80 ? 'high' : 'low';
                    
                    return `<tr>
                        <td>${item.index}</td>
                        <td>${item.method}</td>
                        <td>${item.percentile}</td>
                        <td>${item.target_weight}%</td>
                        <td class="${statusClass}">${item.suggested_pos}%</td>
                    </tr>`;
                }).join('');
            } catch (e) {
                console.error("加载失败", e);
            }
        }
        fetchData();
    </script>
</body>
</html>
