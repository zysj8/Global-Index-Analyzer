<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全球指数估值仪表盘</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; padding: 40px; background: #f8f9fa; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #007bff; color: white; }
        .high { color: #dc3545; font-weight: bold; }
        .low { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
    <h1>全球指数估值与仓位建议</h1>
    <p id="time"></p>
    <table>
        <thead>
            <tr>
                <th>指数名称</th>
                <th>估值方法</th>
                <th>估值百分位</th>
                <th>目标权重</th>
                <th>建议仓位(占目标)</th>
            </tr>
        </thead>
        <tbody id="content"></tbody>
    </table>

    <script>
        fetch('valuation_report.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('time').innerText = "最后更新: " + data.update_time;
                let html = '';
                data.results.forEach(item => {
                    const isHigh = parseFloat(item.percentile) > 80;
                    html += `<tr>
                        <td>${item.index}</td>
                        <td>${item.method}</td>
                        <td>${item.percentile}</td>
                        <td>${item.target_weight}</td>
                        <td class="${isHigh ? 'high' : 'low'}">${item.suggested_pos}%</td>
                    </tr>`;
                });
                document.getElementById('content').innerHTML = html;
            });
    </script>
</body>
</html>
