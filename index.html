<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全球指数多维数据监控</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { border-left: 5px solid #3498db; padding-left: 15px; font-size: 22px; }
        .time { font-size: 13px; color: #888; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #3498db; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .up { color: #e74c3c; font-weight: bold; }
        .down { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>全球指数多维数据监控</h1>
    <p class="time" id="update-time">正在抓取数据...</p>
    <table>
        <thead>
            <tr>
                <th>指数名称</th><th>当前点位</th><th>前日</th><th>20日(本月)</th>
                <th>年初至今</th><th>1年</th><th>3年</th><th>价格分位</th><th>目标权重</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script>
    function getStyle(val) {
        if (!val || val === "---") return "";
        return val.startsWith('+') ? 'class="up"' : (val.startsWith('-') ? 'class="down"' : '');
    }

    async function loadData() {
        try {
            const response = await fetch('valuation_report.json?t=' + Date.now());
            const data = await response.json();
            document.getElementById('update-time').innerText = "最后更新时间: " + data.update_time;
            
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = data.results.map(item => `
                <tr>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.price}</td>
                    <td ${getStyle(item.daily)}>${item.daily}</td>
                    <td ${getStyle(item.m20)}>${item.m20}</td>
                    <td ${getStyle(item.ytd)}>${item.ytd}</td>
                    <td ${getStyle(item.y1)}>${item.y1}</td>
                    <td ${getStyle(item.y3)}>${item.y3}</td>
                    <td>${item.percentile}</td>
                    <td>${item.target_weight}%</td>
                </tr>
            `).join('');
        } catch (e) {
            console.error("解析错误:", e);
        }
    }
    window.onload = loadData;
</script>
</body>
</html>
