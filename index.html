<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全球组合监控</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; border-left: 4px solid #007bff; padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; }
        th { background: #007bff; color: white; }
        .high { color: #d9534f; font-weight: bold; }
        .low { color: #5cb85c; font-weight: bold; }
        .time { font-size: 14px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>全球指数估值与仓位建议</h1>
        <p class="time" id="time"></p>
        <table>
            <thead>
                <tr>
                    <th>指数名称</th>
                    <th>估值方法</th>
                    <th>估值百分位</th>
                    <th>目标权重</th>
                    <th>建议仓位(占目标)</th>
                </tr>
            </thead>
            <tbody id="content"></tbody>
        </table>
    </div>

    <script>
        async function update() {
            const res = await fetch('valuation_report.json?t=' + Date.now());
            const data = await res.json();
            document.getElementById('time').innerText = "最后更新时间: " + data.update_time;
            
            let html = '';
            data.results.forEach(item => {
                const isHigh = parseFloat(item.percentile) > 80;
                // 注意：后端只传数字，这里统一添加一个 %
                html += `<tr>
                    <td>${item.index}</td>
                    <td>${item.method}</td>
                    <td>${item.percentile}</td>
                    <td>${item.target_weight}%</td>
                    <td class="${isHigh ? 'high' : 'low'}">${item.suggested_pos}%</td>
                </tr>`;
            });
            document.getElementById('content').innerHTML = html;
        }
        update();
    </script>
</body>
</html>
