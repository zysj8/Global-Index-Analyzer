name: Global Index Auto Analyzer

on:
  schedule:
    - cron: '0 21 * * *' # 每天北京时间早上5点运行
  workflow_dispatch:      # 允许手动运行

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 关键：授予推送到仓库的权限
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # 升级至 v4，解决弃用警告

      - name: Set up Python
        uses: actions/setup-python@v5 # 升级至 v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install yfinance akshare pandas

      - name: Run Script
        run: python main.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add valuation_report.json
          git commit -m "Update valuation report [skip ci]" || exit 0
          git push
