name: Global Index Auto Analyzer

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  analyze:
    # 强制使用最新的 ubuntu 环境
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 升级 Python 版本以获得更好的库兼容性

      - name: Install Dependencies
        run: pip install yfinance akshare pandas

      - name: Run Script
        run: python main.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add valuation_report.json
          git commit -m "Update valuation report [skip ci]" || exit 0
          git push
